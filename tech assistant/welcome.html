<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tech Assistant - Welcome</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <div class="welcome-container">
    <img src="../tech assistant/icons/icon128.png" alt="Tech Assistant Icon" class="welcome-icon">
    <h1>Welcome!</h1>
    <p class="welcome-subtitle">Choose a tool to get started:</p>
    <div class="tool-options">
      <div class="tool-card" id="autoFillCard">
        <span class="tool-title">Completes task </span>
        <span class="tool-desc">Quickly fill out forms with your data.</span>
      </div>
      <div class="tool-card" id="scheduleCard">
        <span class="tool-title">Schedule a Workpage</span>
        <span class="tool-desc">Plan and organize your workpages.</span>
      </div>
      <div class="tool-card" id="close628Card">
        <span class="tool-title">Close "628"</span>
        <span class="tool-desc">Automate closing of 628 tasks.</span>
      </div>
      <div class="tool-card" id="ridCollectorCard">
        <span class="tool-title">RID Collector</span>
        <span class="tool-desc">Collect and manage RIDs efficiently.</span>
      </div>
    </div>
  </div>
  <script src="welcome.js"></script>
  <script src="RID/ridCollector.js"></script>
</body>
</html>
