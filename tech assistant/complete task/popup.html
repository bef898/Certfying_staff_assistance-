<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <style>
      #icon { display: block; margin: 0 auto; width: 100px; }
   </style> 
</head>
<body>
  <img id="icon" src="icon128.png" alt="Extension Icon">
  <div class="container">
    <div class="header">
      <h1>Tech assistant</h1>
      <p class="subtitle">completes task</p>
    </div>
    
    <div class="file-upload">
      <label for="textFileInput" class="file-label">
        <svg class="file-icon" viewBox="0 0 24 24">
          <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
        </svg>
        <span id="fileName">Choose sentences file</span>
      </label>
      <input type="file" id="textFileInput" accept=".txt">
    </div>

    <div class="options">
      <label class="checkbox-container">
        <input type="checkbox" id="largeFieldsOnly" checked>
        <span class="checkmark"></span>
        <span>Enter "Status Note"</span>
      </label>

      <label class="checkbox-container">
        <input type="checkbox" id="setPartialDropdowns" checked>
        <span class="checkmark"></span>
        <span>Set '"Step Status" dropdowns to "Partial"</span>
      </label>

      <label class="checkbox-container">
        <input type="checkbox" id="checkCheckboxes" checked>
        <span class="checkmark"></span>
        <span>Check all checkboxes</span>
      </label>
       <label class="checkbox-container">
          <input type="checkbox" id="clickOkButton" checked>
          <span class="checkmark"></span>
          <span>Click "OK" button</span>
        </label>
                </div>
    <button id="fillFields" class="action-button">
      <span class="button-text">EXECUTE</span>
      <svg class="button-icon" viewBox="0 0 24 24">
        <path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z" />
      </svg>
    </button>

    <div id="status" class="status-message status-info">
      Ready to fill fields
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
